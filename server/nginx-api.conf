# → /etc/nginx/snippets/vnutri-sebya-api.conf
# В server-блок сайта добавить строку:  include snippets/vnutri-sebya-api.conf;
# Пароль статистики:  htpasswd -c /etc/nginx/vnutri-sebya.htpasswd stats

# Приём результатов: открыт, лимит 5 запросов/мин с IP, без логов доступа
location = /api/results {
    limit_req zone=vs_api burst=5 nodelay;
    client_max_body_size 8k;
    access_log off;
    proxy_pass http://127.0.0.1:8765;
    proxy_read_timeout 10s;
    # X-Real-IP / X-Forwarded-For намеренно не передаём — бэкенд не знает IP
}

# Статистика и выгрузка — только с паролем
location ~ ^/api/(stats|export\.csv)$ {
    auth_basic "Stats";
    auth_basic_user_file /etc/nginx/vnutri-sebya.htpasswd;
    proxy_pass http://127.0.0.1:8765;
    proxy_read_timeout 30s;
}

# Страница статистики — тот же realm, чтобы браузер переиспользовал пароль для fetch
location = /stats.html {
    auth_basic "Stats";
    auth_basic_user_file /etc/nginx/vnutri-sebya.htpasswd;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}

# Всё прочее под /api/ бэкенд не обслуживает
location /api/ {
    return 404;
}
