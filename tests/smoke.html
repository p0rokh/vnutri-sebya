<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>SMOKE RUNNING</title></head>
<body>
<!-- Интеграционный смоук: гоняет site/test.html в iframe программными кликами.
     Запуск: chrome --headless=new --allow-file-access-from-files --dump-dom tests/smoke.html
     Вердикт пишется в <title>. Вопросы и баллы берутся из модели (quiz.js) внутри iframe. -->
<iframe id="f" src="../site/test.html" width="1280" height="900"></iframe>
<script>
"use strict";
var f = document.getElementById("f");
var out = { checks: [], errors: [] };

function ok(name, cond) { out.checks.push((cond ? "PASS " : "FAIL ") + name); }

f.addEventListener("load", function () {
  try {
    var d = f.contentDocument, w = f.contentWindow;
    function $(s) { return d.querySelector(s); }
    var N = w.QUESTIONS.length;

    function startQuiz() { $("#q-start").click(); }
    function options() { return d.querySelectorAll("#q-options .option input"); }
    function currentQ() { return w.QUESTIONS[Number($("#q-num").textContent) - 1]; }
    function scores(q) { return w.optionsFor(q).map(w.scoreOf); }
    // вариант с числовым баллом, ближайшим к target (при равенстве — меньший); без числовых — первый
    function pickClosest(target) {
      var sc = scores(currentQ()), best = -1;
      sc.forEach(function (v, i) { if (v > 0 && (best < 0 || Math.abs(v - target) < Math.abs(sc[best] - target))) best = i; });
      options()[best < 0 ? 0 : best].click();
    }
    function pickCode(code) { options()[scores(currentQ()).indexOf(code)].click(); }
    function readResult() {
      return {
        level: $("#scr-result").getAttribute("data-level"),
        shown: !$("#scr-result").hidden,
        contactsShown: !$("#r-contacts").hidden,
        f1: $('[data-factor="F1"] .factor-bar__value').textContent,
        f3: $('[data-factor="F3"] .factor-bar__value').textContent,
        f4: $('[data-factor="F4"] .factor-bar__value').textContent
      };
    }
    function passBy(chooser) {
      while (!$("#scr-quiz").hidden) { chooser(currentQ()); $("#q-next").click(); }
      return readResult();
    }

    // — согласие —
    ok("старт заблокирован без согласия", $("#q-start").disabled);
    $("#q-consent").click();
    ok("после чекбокса старт активен", !$("#q-start").disabled);

    // — механика: старт, выбор, «Назад» с сохранением —
    startQuiz();
    ok("экран вопросов показан", !$("#scr-quiz").hidden);
    ok("«из 32»", $("#q-total").textContent === String(N) && N === 32);
    ok("подпись раздела на q1", $("#q-section").textContent === "Общая информация");
    ok("«Далее» заблокирована без ответа", $("#q-next").disabled);
    options()[2].click(); // вопрос 1: вариант 3
    ok("«Далее» активна после выбора", !$("#q-next").disabled);
    $("#q-next").click();  // → вопрос 2
    options()[0].click();
    $("#q-next").click();  // → вопрос 3
    ok("прогресс на вопросе 3", $("#q-num").textContent === "3");
    $("#q-back").click();  // ← вопрос 2
    ok("«Назад» вернул на вопрос 2", $("#q-num").textContent === "2");
    ok("ответ на вопросе 2 сохранён", options()[0].checked);
    $("#q-back").click();  // ← вопрос 1
    ok("ответ на вопросе 1 сохранён (вариант 3)", options()[2].checked);

    // — модалка выхода —
    $("#q-exit").click();
    ok("модалка выхода показана", !$("#exit-modal").hidden);
    $("#exit-stay").click();
    ok("«Остаться» закрывает модалку", $("#exit-modal").hidden);

    // — проход 1: все минимальные, q17 пропущен → низкий (R=1.00) —
    var r1 = passBy(function (q) {
      if (q.id === 17) {
        pickCode(-1);
        $("#q-next").click(); $("#q-back").click();
        ok("«Назад» восстанавливает кодовый ответ", options()[options().length - 1].checked);
      } else {
        if (q.id === 22) ok("подпись раздела на q22", $("#q-section").textContent === "Семейное окружение");
        pickClosest(1);
      }
    });
    ok("проход-1: уровень low", r1.level === "low" && r1.shown);
    ok("проход-1: контакты скрыты", !r1.contactsShown);
    ok("проход-1: F1=1.00, F3=1.00", r1.f1 === "1.00" && r1.f3 === "1.00");
    ok("проход-1: блок оценки виден, спасибо скрыто", $("#r-rating-options").children.length === 6 && $("#r-rating-thanks").hidden);
    d.querySelectorAll("#r-rating-options input")[1].click();
    ok("оценка: спасибо показано, варианты заблокированы",
      !$("#r-rating-thanks").hidden && d.querySelectorAll("#r-rating-options input:disabled").length === 6);

    // — перезапуск → проход 2: все ≈2 → средний —
    $("#q-restart").click();
    ok("перезапуск вернул интро", !$("#scr-intro").hidden);
    ok("согласие сохранилось, старт активен", $("#q-consent").checked && !$("#q-start").disabled);
    startQuiz();
    ok("после перезапуска — вопрос 1", $("#q-num").textContent === "1");
    var r2 = passBy(function () { pickClosest(2); });
    ok("проход-2: уровень medium", r2.level === "medium" && r2.shown);
    ok("проход-2: F4=1.93", r2.f4 === "1.93");
    ok("проход-2: оценка снова пустая", $("#r-rating-thanks").hidden && !d.querySelector("#r-rating-options input:checked"));

    // — проход 3: все максимальные → высокий (R=5.00) —
    $("#q-restart").click();
    startQuiz();
    var r3 = passBy(function () { pickClosest(5); });
    ok("проход-3: уровень high", r3.level === "high" && r3.shown);
    ok("проход-3: контакты показаны", r3.contactsShown);
    ok("проход-3: F1=5.00", r3.f1 === "5.00");

    // — проход 4: пропуски и «затрудняюсь» исключаются —
    $("#q-restart").click();
    startQuiz();
    var r4 = passBy(function (q) {
      if (q.id >= 17 && q.id <= 21) pickCode(-1);
      else if (q.id >= 29 && q.id <= 31) pickCode(-2);
      else pickClosest(5);
    });
    ok("проход-4: F3=5.00, F4=5.00, high", r4.f3 === "5.00" && r4.f4 === "5.00" && r4.level === "high");
  } catch (e) {
    out.errors.push(String(e && e.message || e) + " @ " + String(e && e.stack || "").split("\n")[1]);
  }
  var failed = out.checks.filter(function (c) { return c.indexOf("FAIL") === 0; });
  document.title = (failed.length || out.errors.length ? "SMOKE-FAIL " : "SMOKE-PASS ") +
    out.checks.length + " checks; " + failed.concat(out.errors).join("; ");
});
</script>
</body>
</html>
